[package]
name = "talaria"
version = "0.1.7"
edition = "2021"
default-run = "talaria"
license = "MIT"
publish = false
description = "Native Rust TUI client for Hermes Agent"
authors = ["inaki"]
repository = "https://github.com/inaki/talaria"
readme = "README.md"

[[bin]]
name = "talaria"
path = "src/main.rs"

[[example]]
name = "dump_gateway"
path = "examples/dump_gateway.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
figrs = "0.3.1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
tachyonfx = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "macros", "time"] }
tracing = "0.1"
unicode-width = "0.2"
which = "8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
logo-art = "0.2.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "macros", "time", "test-util"] }
