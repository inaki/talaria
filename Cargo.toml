[package]
name = "hermes-rust"
version = "0.1.0"
edition = "2021"
default-run = "hermes-rust"
publish = false
description = "Native ratatui host for the official Hermes tui_gateway"
authors = ["hermes-rust"]

[[bin]]
name = "hermes-rust"
path = "src/main.rs"

[[example]]
name = "dump_gateway"
path = "examples/dump_gateway.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "macros", "time"] }
tracing = "0.1"
which = "8"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "macros", "time", "test-util"] }
